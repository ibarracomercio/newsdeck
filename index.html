    <script>
        // Tu clave personal y exclusiva vinculada exitosamente sin caracteres erróneos
        const API_KEY = "2d4a08dd3f64f5c6cb35130532aac934"; 
        
        const URLS = {
            militar: "https://gnews.io" + API_KEY,
            politica: "https://gnews.io" + API_KEY,
            global: "https://gnews.io" + API_KEY
        };

        let colasNoticias = { militar: [], politica: [], global: [] };

        function obtenerFechaMilitarActual() {
            const ahora = new Date();
            const hora = String(ahora.getHours()).padStart(2, '0');
            const minutes = String(ahora.getMinutes()).padStart(2, '0');
            const dia = String(ahora.getDate()).padStart(2, '0');
            const meses = ["ENE", "FEB", "MAR", "ABR", "MAY", "JUN", "JUL", "AGO", "SET", "OCT", "NOV", "DIC"];
            return `${hora}${minutes}Q ${dia}${meses[ahora.getMonth()]}${String(ahora.getFullYear()).slice(-2)}`;
        }

        async function consultarServidores(categoria) {
            try {
                const respuesta = await fetch(URLS[categoria]);
                if (!respuesta.ok) throw new Error();
                const datos = await respuesta.json();
                if(datos.articles && datos.articles.length > 0) {
                    colasNoticias[categoria] = datos.articles;
                }
            } catch (e) {
                console.error("Error cargando transmisiones para: " + categoria);
            }
        }

        function empujarAscensorVertical(categoria, idFeed, idStatus) {
            const cajaFeed = document.getElementById(idFeed);
            const textoEstado = document.getElementById(idStatus);
            
            if (cajaFeed.children.length >= 20) {
                cajaFeed.innerHTML = '';
                textoEstado.innerText = "REINICIANDO...";
                return;
            }

            const listaActual = colasNoticias[categoria];
            if (!listaActual || listaActual.length === 0) {
                textoEstado.innerText = "ESPERANDO DATA";
                return;
            }

            const item = listaActual[Math.floor(Math.random() * listaActual.length)];
            const tarjeta = document.createElement('div');
            tarjeta.className = 'news-card';
            
            let desc = item.description || "Haga clic en el enlace superior para ampliar la información de inteligencia.";
            desc = desc.substring(0, 150) + "...";
            const fuente = item.source.name || "GNEWS OSINT";

            tarjeta.innerHTML = `
                <div class="news-title"><a href="${item.url}" target="_blank">${item.title}</a></div>
                <div class="news-desc">${desc}</div>
                <div class="news-footer">
                    <span>${fuente.toUpperCase()}</span>
                    <span>${obtenerFechaMilitarActual()}</span>
                </div>
            `;
            
            cajaFeed.insertBefore(tarjeta, cajaFeed.firstChild);
            textoEstado.innerText = `COUNT: ${cajaFeed.children.length}/20`;
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await Promise.all([
                consultarServidores('militar'),
                consultarServidores('politica'),
                consultarServidores('global')
            ]);

            empujarAscensorVertical('militar', 'feed-militar', 'status-militar');
            empujarAscensorVertical('politica', 'feed-politica', 'status-politica');
            empujarAscensorVertical('global', 'feed-global', 'status-global');

            // Frecuencia del ascensor automatizado continuo
            setInterval(() => { empujarAscensorVertical('militar', 'feed-militar', 'status-militar'); }, 6000);
            setInterval(() => { empujarAscensorVertical('politica', 'feed-politica', 'status-politica'); }, 9000);
            setInterval(() => { empujarAscensorVertical('global', 'feed-global', 'status-global'); }, 7500);
        });
    </script>
</body>
</html>
